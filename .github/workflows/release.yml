name: Release
on:
  # Can be run manually
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # on git push
  push:
    branches:
      - main

# Only one run at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Answers "did this commit arrive through a pull request, and from which branch?" - which a job's
  # own `if:` cannot ask: a job condition is evaluated before any job runs, and a push payload says
  # nothing about a pull request.
  source:
    uses: panates/github-actions/.github/workflows/pr-source.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: source
    # An empty `head-ref` means the commit came from no pull request and runs the tests - the safe
    # direction, since nothing recorded that this exact commit was tested anywhere.
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'no-test') &&
          needs.source.outputs.head-ref != 'dev'
        )
      )
    uses: ./.github/workflows/test.yml

  release:
    needs: [source, test]
    # `always()` because `needs` alone blocks this whenever `test` is skipped, which is a normal
    # path. `needs.source.result == 'success'` keeps a failed lookup (which skips `test`) from
    # releasing untested code.
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: panates/github-actions/.github/workflows/node-release.yaml@v3
    # Declared on the calling job, because that is what governs a reusable workflow's permissions.
    permissions:
      id-token: write
      contents: write
    secrets:
      # No PERSONAL_ACCESS_TOKEN: every package's publishConfig is {"access": "public"} on npmjs,
      # no manifest names another registry and there is no .npmrc. The old restore-cache job (an
      # Oracle instantclient cache) is gone too - nothing here uses it.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
